name: Freitag AI · Live sync regression
on:
  push:
    branches: [feature/freitag-ai-live-master-sync]
    paths:
      - "ai/**"
      - "proxy/freitag-modelproxy-worker.js"
      - "functions/api/freitag/**"
      - "writer/js/views/aicenter.js"
      - "scripts/build-apps.sh"
      - "tests/freitag-*.test.js"
      - ".github/workflows/freitag-bothub-check.yml"
  pull_request:
    branches: [feature/freitag-ai-bothub-compact]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check ai/app.js
          node --check ai/live-context.js
          node --check proxy/freitag-modelproxy-worker.js
          node --check "functions/api/freitag/[route].js"
          node --check writer/js/views/aicenter.js
      - name: Full regression suite
        run: npm test
      - name: Build deployed files and verify live connector is bundled
        run: |
          bash scripts/build-apps.sh test-build _site
          test -f _site/test-build/ai/live-context.js
          test -f _site/test-build/ai/master-sync.js
          test -f _site/test-build/writer/js/bookai.js
          test -f _site/test-build/writer/js/drive.js
