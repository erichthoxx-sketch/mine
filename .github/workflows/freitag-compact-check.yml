name: Freitag AI · compact chat and model autosave
on:
  push:
    branches: [feature/freitag-ai-compact-autosave-model]
    paths:
      - "ai/**"
      - "tests/freitag-*.test.js"
      - "scripts/build-apps.sh"
      - ".github/workflows/freitag-compact-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check ai/app.js
          node --check ai/live-context.js
      - name: Regression tests
        run: npm test
      - name: Preview bundle
        run: |
          bash scripts/build-apps.sh ui-preview _site
          test -f _site/ui-preview/ai/app.js
          test -f _site/ui-preview/ai/style.css
          test -f _site/workshop/bear.svg
