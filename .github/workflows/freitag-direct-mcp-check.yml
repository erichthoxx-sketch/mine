name: Freitag AI · direct Masterskaya MCP
on:
  push:
    branches: [feature/freitag-ai-direct-mcp-all-apps]
    paths:
      - "ai/**"
      - "proxy/freitag-modelproxy-worker.js"
      - "functions/api/freitag/**"
      - "tests/freitag-*.test.js"
      - ".github/workflows/freitag-direct-mcp-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check ai/app.js
          node --check proxy/freitag-modelproxy-worker.js
          node --check functions/api/freitag/'[route].js'
      - name: Regression suite
        run: npm test
      - name: Build Preview
        run: |
          bash scripts/build-apps.sh mcp-preview _site
          test -f _site/mcp-preview/ai/app.js
          test -f _site/workshop/bear.svg
