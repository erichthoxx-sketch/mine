name: Freitag AI · Проверка тестового интерфейса

on:
  push:
    branches:
      - feature/freitag-ai-minimal-workspace
    paths:
      - "ai/**"
      - "proxy/freitag-modelproxy-worker.js"
      - "functions/api/freitag/**"
      - "scripts/freitag-visual-smoke.mjs"
      - "tests/*.test.js"
      - ".github/workflows/freitag-ui-preview.yml"
  pull_request:
    branches:
      - feature/freitag-ai-polza-opus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freitag-ui-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ui-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check ai/app.js
          node --check ai/master-sync.js
          node --check proxy/freitag-modelproxy-worker.js
          node --check "functions/api/freitag/[route].js"
          node --check scripts/freitag-visual-smoke.mjs
      - name: Run regression tests
        run: npm test
      - name: Prepare browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          bash scripts/build-apps.sh visual _site
          python3 -m http.server 8765 --directory _site >/tmp/freitag-preview-http.log 2>&1 &
          sleep 2
      - name: Test real desktop and mobile browsers
        run: node scripts/freitag-visual-smoke.mjs
      - name: Save screenshots as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freitag-ai-ui-screenshots
          path: docs/freitag-ui-preview/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified screenshots to preview branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/freitag-ai-minimal-workspace'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/freitag-ui-preview/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(freitag): add verified UI screenshots [skip ci]"
            git push origin HEAD:feature/freitag-ai-minimal-workspace
          fi
