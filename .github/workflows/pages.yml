name: Публикация сайта
on:
  push:
    branches: [main, 'claude/author-income-ads-tracker-3zjbxd']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # одна задача: проверка расчётов → сборка → публикация (ждём свободный сервер GitHub один раз)
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: |
          # каждая версия — в своей папке, чтобы браузер не держал старые файлы
          V=v${GITHUB_SHA::8}
          mkdir -p _site/$V
          mkdir -p _site/$V/writer _site/pisatel _site/$V/direct _site/direct
          cp -r css js _site/$V/
          cp -r js/vendor _site/vendor  # постоянная копия библиотек — для страниц, открытых до обновления сайта
          cp -r writer/js _site/$V/writer/
          cp -r direct/js _site/$V/direct/
          echo $V > _site/version.txt
          cp manifest.webmanifest heart-line.svg heart-line-180.png heart-line-512.png _site/
          cp writer/manifest.webmanifest writer/star.svg writer/star-180.png writer/star-512.png _site/pisatel/
          cp direct/manifest.webmanifest direct/target.svg direct/target-180.png direct/target-512.png proxy/direct-worker.js _site/direct/
          sed "s#__APPV__#$V#; s#css/style.css#$V/css/style.css#; s#js/app.js#$V/js/app.js#" index.html > _site/index.html
          sed "s#__APPV__#$V#; s#\.\./css/style.css#../$V/css/style.css#; s#\"js/app.js#\"../$V/writer/js/app.js#" writer/index.html > _site/pisatel/index.html
          sed "s#__APPV__#$V#; s#\.\./css/style.css#../$V/css/style.css#; s#\"js/app.js#\"../$V/direct/js/app.js#" direct/index.html > _site/direct/index.html
          # сайт автора (/site/) и его админка (/site/admin/)
          mkdir -p _site/site/admin _site/js
          cp js/firebase-config.js _site/js/
          cp site/*.js site/*.css _site/site/
          cp site/admin/*.js site/admin/*.css _site/site/admin/
          # все части сайта — с номером версии, чтобы браузер не смешивал старые и новые файлы
          sed -i "s#\(from '\.\{1,2\}/[^']*\.js\)'#\1?v=$V'#g" _site/site/*.js _site/site/admin/*.js
          grep -q "content.js?v=$V" _site/site/site.js
          sed "s#__V__#$V#g" site/index.html > _site/site/index.html
          sed "s#__V__#$V#g" site/admin/index.html > _site/site/admin/index.html
          grep -q "$V" _site/site/admin/index.html
          grep -q "$V/js/app.js" _site/index.html
          grep -q "$V/writer/js/app.js" _site/pisatel/index.html
          grep -q "$V/css/style.css" _site/pisatel/index.html
          grep -q "$V/direct/js/app.js" _site/direct/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
