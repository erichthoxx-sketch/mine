name: Публикация сайта
on:
  push:
    branches: [main, 'claude/author-income-ads-tracker-3zjbxd']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          # каждая версия — в своей папке, чтобы браузер не держал старые файлы
          V=v${GITHUB_SHA::8}
          mkdir -p _site/$V
          cp -r css js _site/$V/
          cp manifest.webmanifest icon.svg _site/
          sed "s#css/style.css#$V/css/style.css#; s#js/app.js#$V/js/app.js#" index.html > _site/index.html
          grep -q "$V/js/app.js" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
