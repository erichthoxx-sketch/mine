name: Публикация сайта
on:
  push:
    branches: [main, 'claude/author-income-ads-tracker-3zjbxd']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # одна задача: проверка расчётов → сборка → публикация (ждём свободный сервер GitHub один раз)
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: |
          # каждая версия — в своей папке, чтобы браузер не держал старые файлы
          V=v${GITHUB_SHA::8}
          mkdir -p _site/$V
          mkdir -p _site/$V/writer _site/pisatel _site/$V/taro _site/taro
          cp -r css js _site/$V/
          cp -r writer/js _site/$V/writer/
          cp -r taro/js taro/taro.css _site/$V/taro/
          echo $V > _site/version.txt
          cp manifest.webmanifest heart-line.svg heart-line-180.png heart-line-512.png _site/
          cp writer/manifest.webmanifest writer/star.svg writer/star-180.png writer/star-512.png _site/pisatel/
          cp taro/manifest.webmanifest taro/moon.svg taro/moon-180.png taro/moon-512.png _site/taro/
          sed "s#__APPV__#$V#; s#css/style.css#$V/css/style.css#; s#js/app.js#$V/js/app.js#" index.html > _site/index.html
          sed "s#__APPV__#$V#; s#\.\./css/style.css#../$V/css/style.css#; s#\"js/app.js#\"../$V/writer/js/app.js#" writer/index.html > _site/pisatel/index.html
          sed "s#__APPV__#$V#; s#\.\./css/style.css#../$V/css/style.css#; s#\"taro.css#\"../$V/taro/taro.css#; s#\"js/app.js#\"../$V/taro/js/app.js#" taro/index.html > _site/taro/index.html
          grep -q "$V/js/app.js" _site/index.html
          grep -q "$V/writer/js/app.js" _site/pisatel/index.html
          grep -q "$V/css/style.css" _site/pisatel/index.html
          grep -q "$V/taro/js/app.js" _site/taro/index.html
          grep -q "$V/taro/taro.css" _site/taro/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
